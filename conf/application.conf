include "backend.conf"

# This is the main configuration file for the application.
# ~~~~~

appName = stamp-duty-land-tax

# Default http client
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"
play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"
# Play Modules
play.modules.enabled += "uk.gov.hmrc.stampdutylandtax.Module"

mongodb {
  uri = "mongodb://localhost:27017/"${appName}
}

internal-auth.token = "6e8f4e4c-1f1e-4a1e-9f2a-3a5b7c9d0e1f"

schedules {
  PurgeReturnsJob {
    enabled          = false
    description      = "Purge returns that are due for deletion (F49)"
    expression       = "0_0_0_?_*_*"  # daily at midnight (underscores are replaced with spaces)
    mongoLockTimeout = "20 minutes"
  }
  PollSubmissionsJob {
    enabled          = false
    description      = "Poll ChRIS for in-flight submissions (F52)"
    expression       = "0_0/30_*_?_*_*"  # every 30 minutes (underscores are replaced with spaces)
    mongoLockTimeout = "45 minutes"
  }
}


# The application languages
# ~~~~~
play.i18n.langs = ["en"]

# Router
# ~~~~~
# Define the Router object to use for this application.
# This router will be looked up first when the application is starting up,
# so make sure this is the entry point.
# Furthermore, it's assumed your route file is named properly.
# So for an application router like `my.application.Router`,
# you may need to define a router file `conf/my.application.routes`.
# Default to Routes in the root package (and conf/routes)
# !!!WARNING!!! DO NOT CHANGE THIS ROUTER
play.http.router = prod.Routes

# Controller
# ~~~~~
# By default all controllers will have authorisation, logging and
# auditing (transaction monitoring) enabled.
# The below controllers are the default exceptions to this rule.


# Microservice specific config


microservice {
  services {
    auth {
      host = localhost
      port = 8500
    }
    stamp-duty-land-tax-stub {
      protocol = http
      host     = localhost
      port     = 10914
    }
    formp-proxy {
      protocol = http
      host     = localhost
      port     = 6995
    }
    internal-auth {
      protocol = http
      host     = localhost
      port     = 8470
    }
   chris {
         protocol = http
         host     = localhost
         port     = 10914
         submit-url = "/stamp-duty-land-tax-stub/ChRIS/SDLT/Filing/sync/SDLT"
         delete-url = "/stamp-duty-land-tax-stub/ChRIS/SDLT/Filing/sync/SDLT"
         stub = true
       }
   email {
         protocol = https
         host = localhost
         port = 10914
   }
  }
}

stamp-duty-land-tax-stub.baseUrl = /stamp-duty-land-tax-stub

features {
  stub-formp-enabled = true
}

urls {
  login = "http://localhost:9949/auth-login-stub/gg-sign-in"
}


chris.channel {
  uri      = "2000"
  product  = "EzGov IR-SDLT-LTR"
  version  = "3.4"

  useExternalTestService = false
}